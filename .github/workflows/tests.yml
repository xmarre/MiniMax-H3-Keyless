name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
          python -m pip install safetensors pytest
          python -m pip install -e . --no-deps
      - name: Compile package
        run: python -m compileall -q minimax_h3_keyless tests
      - name: Run CPU contract tests
        run: python -m pytest
